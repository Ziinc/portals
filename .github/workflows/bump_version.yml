name: Bump version

# Opens a pull request that moves every package and SDK to the given
# version (scripts/version.exs bump), and runs CI on it. Merge it, then
# create the GitHub release to publish. See CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # To start CI on the new branch (see below).
  actions: write

jobs:
  bump:
    name: Bump to ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
      - name: Bump, push and open the pull request
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${INPUT_VERSION#v}
          branch="bump-v$version"
          elixir scripts/version.exs bump "$version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump version to $version"
          git push origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "Bump version to $version" \
            --body "Moves core \`portals\`, every \`portals_<language>\` package and each bundled SDK to $version (\`elixir scripts/version.exs bump $version\`). After merging, create the \`v$version\` GitHub release on \`main\` to publish to Hex."

          # Pushes and pull requests made with GITHUB_TOKEN don't trigger
          # workflows; a workflow_dispatch does, and its checks show on the PR.
          gh workflow run ci.yml --ref "$branch"
