name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit and integration tests (fast subset)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        elixir: ["1.14"]
        otp: ["25"]

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      # The fast regression subset (Phase 8): unit + integration tests
      # only. Benchmarks under bench/ are intentionally excluded — they're
      # run on demand via `mix run bench/*.exs`, not on every push, since
      # they measure absolute performance rather than correctness and are
      # far too noisy/slow for a CI gate.
      - name: Run tests
        run: mix test --exclude soak
